# ==============================================================================
# DEFINITIVE CALIBRATION CONFIGURATION (V2)
# Defines the full, tiered search space for the optimization algorithm.
# ==============================================================================

# -- Strategic choices for the calibration run itself
optimization_setup:
  number_of_acz: 6
  objective_weights:
    rmse: 0.5
    spearman_correlation: 0.5
  potential_yield_safety_margin: 1.10

# ==============================================================================
# === TIER 1: PRIMARY CALIBRATION PARAMETERS (THE BIG LEVERS) ==================
# (These have the largest impact on overall yield, phenology, and biomass)
# ==============================================================================
tier_1_params:
  # -- Phenology (When things happen)
  TSUM1: { min: 750, max: 950 }   # GDD Emergence to Anthesis
  TSUM2: { min: 800, max: 1000 }  # GDD Anthesis to Maturity

  # -- Photosynthesis (The engine)
  # AMAXTB is not a single value but a table (AFGEN). We'll calibrate key points on the curve.
  # Let's define the peak assimilation rate. The rest of the table can be scaled.
  AMAXTB_PEAK: { min: 35.0, max: 55.0 } # Peak CO2 assimilation rate (kg CO2/ha/hr)
  EFFTB: { min: 0.40, max: 0.55 } # Initial light use efficiency

  # -- Partitioning (Where biomass goes)
  # These are tables. We'll calibrate the values at key development stages (e.g., DVS=0.5, 1.0, 1.5)
  # This is a simplification; a more advanced setup would tune the whole AFGEN table.
  FLTB_dvs_1: { min: 0.6, max: 0.8 } # Frac. to leaves at start of storage organ formation
  FOTB_dvs_1_5: { min: 0.7, max: 0.9 } # Frac. to storage organs in late season
  FRTB_dvs_0_5: { min: 0.1, max: 0.3 } # Frac. to roots in early season

  # -- Leaf Area Development
  SLATB_dvs_0_5: { min: 0.0015, max: 0.0025 } # Specific Leaf Area early on (ha/kg)
  SPAN: { min: 25, max: 45 } # Lifespan of leaves at 35 C (days)

# ==============================================================================
# === TIER 2: SECONDARY CALIBRATION PARAMETERS (FINER TUNING) ================
# (These modulate plant responses to specific stresses and conditions)
# ==============================================================================
tier_2_params:
  # -- Water Stress Response
  # How drought sensitive is the crop? Group 3-4 might be a good range for sugarbeets.
  DEPNR: { min: 3, max: 5, type: int } # Crop group number for water depletion (1=sensitive, 5=resistant)
  PERDL: { min: 0.01, max: 0.05 } # Max relative death rate of leaves due to water stress (d-1)

  # -- Temperature Stress & Respiration
  # TMPFTB & TMNFTB are tables. We can tune the optimal temperature and the steepness of the drop-off.
  TMPFTB_OPT_TEMP: { min: 18.0, max: 25.0 } # Optimal daytime temp for photosynthesis
  Q10: { min: 1.8, max: 2.2 } # Relative increase of respiration per 10C

  # -- Root Growth
  RRI: { min: 1.0, max: 2.5 } # Maximum daily increase in rooting depth (cm/day)
  RDMCR: { min: 120, max: 200 } # Crop-dependent maximum rooting depth (cm)

  # -- Conversion Efficiency (Growth Respiration)
  CVL: { min: 0.68, max: 0.74 } # Conversion efficiency assimilates to leaves
  CVO: { min: 0.68, max: 0.75 } # Conversion efficiency assimilates to storage organs (the beets)

# ==============================================================================
# === TIER 3: FIXED OR DERIVED PARAMETERS (REVIEW, BUT DON'T CALIBRATE INITIALLY) ===
# (These are often based on fundamental physics or are less sensitive. We set
#  them to a literature value but could expose them to calibration later if needed.)
# ==============================================================================
tier_3_params:
  # -- Light Extinction
  KDIFTB: { value: 0.72 } # Extinction coefficient for diffuse light. Could vary with canopy architecture.

  # -- Maintenance Respiration Coefficients (per organ)
  RML: { value: 0.03 }   # Leaves
  RMO: { value: 0.015 }  # Storage Organs
  RMS: { value: 0.015 }  # Stems
  RMR: { value: 0.01 }   # Roots

  # -- Initial Conditions
  TDWI: { value: 20 } # Initial total dry weight of crop (kg/ha)
  RDI: { value: 10 } # Initial rooting depth (cm)