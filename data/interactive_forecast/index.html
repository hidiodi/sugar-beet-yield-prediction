<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Yield Forecast Model</title>

    <!-- Leaflet.js for mapping (Requires internet for map tiles) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        /* Basic Styling */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #f4f4f4;
        }
        #map {
            height: 100%;
            width: 70%;
            background-color: #e9e9e9;
        }
        #sidebar {
            width: 30%;
            padding: 25px;
            box-sizing: border-box;
            background-color: #ffffff;
            overflow-y: auto;
            box-shadow: -3px 0px 15px rgba(0,0,0,0.1);
        }
        #sidebar h2 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        #sidebar p {
            line-height: 1.6;
            color: #555;
        }
        .navigation {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
        }
        .navigation button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #007bff;
            color: white;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .navigation button:hover {
            background-color: #0056b3;
        }
        .navigation button:disabled {
            background-color: #c0c0c0;
            cursor: not-allowed;
        }
        #legend {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border: 1px solid #888;
        }
        .loading-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
            color: #333;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="sidebar">
        <h2 id="story-title">Loading Data...</h2>
        <p id="story-description">Please wait while we load the geographic and model data.</p>
        <div id="legend"></div>
        <div class="navigation">
            <button id="prev-btn" disabled>Previous</button>
            <button id="next-btn" disabled>Next</button>
        </div>
    </div>

    <div class="loading-overlay" id="loading">
        <p>Loading Model Data...</p>
    </div>


    <script>
        // --- 1. CONFIGURATION & SETUP ---
        const GEOJSON_PATH = '../01_raw/districts_official.geojson';
        const CSV_DATA_PATH = '../05_model_input/stage1_preseason_features.csv';

        const storySteps = [
            { title: "Step 1: Our Geographic Foundation", description: "Our forecast begins with the unique geography of Germany's districts. This map shows the basic administrative boundaries, providing the canvas for our analysis.", layer: null, legendTitle: "German Districts" },
            { title: "Step 2: The Land's Potential", description: "We layer in stable environmental data, like the soil's ability to hold water ('Plant Available Water Capacity'). This gives us a baseline of each district's natural potential.", layer: 'avg_soil_pawc', legendTitle: "Avg. Soil Water Capacity (PAWC)", colors: ['#edf8b1', '#7fcdbb', '#2c7fb8'], labels: ['Low', 'Medium', 'High'] },
            { title: "Step 3: Spring Weather Anomaly", description: "Next, we add dynamic data available by March. This shows the 'Spring Precipitation Anomaly'—how this year's forecast rainfall compares to the long-term average. Blues indicate wetter than normal conditions, browns are drier.", layer: 'spring_precip_anomaly_forecast', legendTitle: "Spring Precipitation vs. Average", colors: ['#d7191c', '#ffffbf', '#2c7fb8'], labels: ['Drier (-1)', 'Average (0)', 'Wetter (+1)'] },
            { title: "Step 4: The Economic Climate", description: "Farming isn't just about weather; it's about economics. We incorporate national-level data like the 'Fertilizer Price Index'. While not shown visually per district, this factor influences the model's calculations for the entire country.", layer: 'fertilizer_price_index', legendTitle: "Fertilizer Price Index", isNational: true },
            { title: "Step 5: The Model's Goal (Forecast)", description: "By combining all data layers, our model's goal is to predict the final yield. This map visualizes the historical yield data that our model learns from, representing what a perfect forecast would look like.", layer: 'kreisYield', legendTitle: "Target Yield (dt/ha)", colors: ['#d7191c', '#fdae61', '#ffffbf', '#a6d96a', '#1a9641'], labels: ['< 60', '60-70', '70-80', '80-90', '> 90'] },
            { title: "Step 6: The Historical Reality", description: "To train a powerful model, we need accurate historical data. This map shows the same ground-truth yield data ('kreisYield'), emphasizing that our model is built on real-world, historical results.", layer: 'kreisYield', legendTitle: "Historical Actual Yield (dt/ha)", colors: ['#d7191c', '#fdae61', '#ffffbf', '#a6d96a', '#1a9641'], labels: ['< 60', '60-70', '70-80', '80-90', '> 90'] }
        ];

        // Global variables
        let currentStep = 0, map, geojsonLayer, mergedGeoJSON;
        const titleEl = document.getElementById('story-title'), descriptionEl = document.getElementById('story-description'), legendEl = document.getElementById('legend'), prevBtn = document.getElementById('prev-btn'), nextBtn = document.getElementById('next-btn'), loadingEl = document.getElementById('loading');

        // --- 2. INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            map = L.map('map').setView([51.1657, 10.4515], 6);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
            loadData();
        });

        // --- 3. DATA LOADING & PROCESSING ---

        // *** UPDATED: SELF-CONTAINED CSV PARSER ***
        function parseCSV(csvText) {
            // This regex handles both Windows (\r\n) and Unix (\n) line endings
            const lines = csvText.trim().split(/\r?\n/);
            const headers = lines[0].split(',').map(h => h.trim());
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const obj = {};
                const currentLine = lines[i].split(',');
                for (let j = 0; j < headers.length; j++) {
                    const header = headers[j];
                    const value = currentLine[j] ? currentLine[j].trim() : '';

                    // *** THE FIX IS HERE ***
                    // Keep 'district_no' as a string to preserve leading zeros.
                    // Convert other values to numbers if they are numeric.
                    if (header === 'district_no') {
                        obj[header] = value;
                    } else {
                        obj[header] = !isNaN(value) && value !== '' ? Number(value) : value;
                    }
                }
                result.push(obj);
            }
            return result;
        }

        async function loadData() {
            try {
                const [geojsonResponse, csvResponse] = await Promise.all([ fetch(GEOJSON_PATH), fetch(CSV_DATA_PATH) ]);
                if (!geojsonResponse.ok || !csvResponse.ok) throw new Error(`GeoJSON status: ${geojsonResponse.status}, CSV status: ${csvResponse.status}`);

                const geojsonData = await geojsonResponse.json();
                const csvText = await csvResponse.text();

                const modelData = parseCSV(csvText);

                mergedGeoJSON = mergeData(geojsonData, modelData);

                setupUI();
                updateView();
                loadingEl.style.display = 'none';

            } catch (error) {
                console.error("Error loading data:", error);
                titleEl.textContent = "Error Loading Data";
                descriptionEl.textContent = `Could not load data. Please check the browser console (F12) for details. Error: ${error.message}`;
                loadingEl.style.display = 'none';
            }
        }

        function mergeData(geojson, csvData) {
            const dataMap = new Map();
            // Create a lookup map using the string `district_no` as the key.
            for (const row of csvData) { if (row.district_no) dataMap.set(row.district_no, row); }

            geojson.features.forEach(feature => {
                // Ensure the GeoJSON's AGS property is treated as a string for matching.
                const districtId = String(feature.properties.AGS);
                const dataRow = dataMap.get(districtId);
                if (dataRow) {
                    feature.properties = { ...feature.properties, ...dataRow };
                }
            });
            return geojson;
        }

        // --- 4. UI & MAP LOGIC ---
        function setupUI() {
            prevBtn.addEventListener('click', () => { if (currentStep > 0) { currentStep--; updateView(); } });
            nextBtn.addEventListener('click', () => { if (currentStep < storySteps.length - 1) { currentStep++; updateView(); } });
        }

        function updateView() {
            const step = storySteps[currentStep];
            titleEl.textContent = step.title;
            descriptionEl.textContent = step.description;
            prevBtn.disabled = (currentStep === 0);
            nextBtn.disabled = (currentStep === storySteps.length - 1);

            if (geojsonLayer) map.removeLayer(geojsonLayer);

            geojsonLayer = L.geoJson(mergedGeoJSON, {
                style: getFeatureStyle,
                onEachFeature: (feature, layer) => {
                    const step = storySteps[currentStep];
                    let value = feature.properties[step.layer];
                    // Display year in tooltip for context
                    const year = feature.properties.year;
                    const yearText = year ? ` (${year})` : '';
                    const popupContent = `<b>${feature.properties.GEN}${yearText}</b><br>${step.legendTitle}: ${value !== undefined ? Number(value).toFixed(2) : 'N/A'}`;
                    layer.bindTooltip(popupContent);
                }
            }).addTo(map);

            updateLegend();
        }

        function getFeatureStyle(feature) {
            const dataKey = storySteps[currentStep].layer;
            const value = dataKey ? feature.properties[dataKey] : null;
            return { fillColor: getColor(value, dataKey), weight: 0.5, opacity: 1, color: 'white', fillOpacity: 0.7 };
        }

        function updateLegend() {
            const step = storySteps[currentStep];
            if (step.isNational) {
                const firstFeatureWithData = mergedGeoJSON.features.find(f => f.properties[step.layer] !== undefined);
                const nationalValue = firstFeatureWithData ? firstFeatureWithData.properties[step.layer] : 'N/A';
                legendEl.innerHTML = `<h4>${step.legendTitle}</h4><p>National Value Example: ${nationalValue}</p>`;
                return;
            }
            if (!step.colors || !step.labels) {
                legendEl.innerHTML = `<h4>${step.legendTitle || ''}</h4>`;
                return;
            }
            let legendHTML = `<h4>${step.legendTitle}</h4>`;
            for (let i = 0; i < step.colors.length; i++) {
                legendHTML += `<div class="legend-item"><div class="legend-color" style="background-color:${step.colors[i]}"></div><span>${step.labels[i]}</span></div>`;
            }
            legendEl.innerHTML = legendHTML;
        }

        // --- 5. HELPER: COLOR SCALES ---
        function getColor(value, key) {
            if (value === null || value === undefined) return '#cccccc';
            switch (key) {
                case 'avg_soil_pawc': return value > 180 ? '#2c7fb8' : value > 150 ? '#7fcdbb' : '#edf8b1';
                case 'spring_precip_anomaly_forecast': return value > 0.5 ? '#2c7fb8' : value < -0.5 ? '#d7191c' : '#ffffbf';
                case 'kreisYield': return value > 90 ? '#1a9641' : value > 80 ? '#a6d96a' : value > 70 ? '#ffffbf' : value > 60 ? '#fdae61' : '#d7191c';
                default: return '#cccccc';
            }
        }
    </script>
</body>
</html>
